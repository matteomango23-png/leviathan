<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prova squalo dai video</title>
<!-- Test page (owner, 11 ottobre 2026): the new bone megalodon animated from the owner's videos (npm run art:video,
     frames in ../<id>/<clip>/) next to today's spine animation of a painted profile. Built on
     prototype/prova-realistica.html (painted layers, darkness and lamp, the shark's patrol). Other animals: ?id=<id>. -->
<style>
:root{
  --bg:#02070c; --ink:#e6ede8; --muted:#8fa7ad; --lamp:#ffd9a0; --glow:#5ff3d6; --panel:rgba(3,12,19,.78); --line:rgba(176,138,74,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#02070c; } }
:root[data-theme="dark"]{ --bg:#02070c; }
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Helvetica Neue',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#tools{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px}
.tb{font:600 13px -apple-system,system-ui,sans-serif;color:var(--lamp);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 11px;min-height:36px}
.tb.on{background:rgba(176,138,74,.4);color:#fff}
#btns{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end}
.act{border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(46,66,74,.55),rgba(3,10,16,.85));border:2px solid rgba(176,138,74,.85);color:var(--lamp);font:700 13px -apple-system,system-ui,sans-serif}
#bTurn{width:78px;height:78px}
#bDash{width:58px;height:58px}
#info{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);text-shadow:0 1px 3px #000;pointer-events:none;max-width:55%}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--lamp);background:var(--bg)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tools">
    <button class="tb on" id="tMode">Animazione: video</button>
    <button class="tb" id="tPlay">Vetrina</button>
    <button class="tb" id="tLen">Lunghezza: 9 m</button>
    <button class="tb" id="tSlow">Lento</button>
    <button class="tb on" id="tLamp">Lampada</button>
  </div>
  <div id="btns"><button class="act" id="bDash">Scatto</button><button class="act" id="bTurn">Vira</button></div>
  <div id="info"></div>
  <div id="load">Carico i fotogrammi…</div>
</div>
<script>
'use strict';
const ID=new URLSearchParams(location.search).get('id')||'megalodonte_osso';
const BASE=`../${ID}/`;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const lightC=document.createElement('canvas'),lg=lightC.getContext('2d');
let W=0,H=0,DPR=1,WH=0;
const layers={},kelp=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
function ridge(x,seed,amp,freq){let y=0;for(let o=1;o<=4;o++){y+=Math.sin(x*freq*o*1.7+seed*o*3.1+Math.sin(x*freq*0.5*o+seed))*amp/o;}return y;}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=Math.round(innerWidth*DPR);H=Math.round(innerHeight*DPR);
  cv.width=W;cv.height=H;lightC.width=Math.ceil(W/2);lightC.height=Math.ceil(H/2);buildLayers();
}
function buildLayers(){
  WH=H*1.6;
  const mk=(w,h,s)=>{const c=document.createElement('canvas');c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);const g=c.getContext('2d');g.scale(s,s);return {c,g,w,h,s};};
  const far=mk(W*2,WH,0.5);{const g=far.g;const base=WH*0.62;
    const gr=g.createLinearGradient(0,base-WH*0.3,0,WH);gr.addColorStop(0,'#0b2531');gr.addColorStop(1,'#04111a');g.fillStyle=gr;
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=W*2;x+=8*DPR){const t=x/(W*2)*Math.PI*2;g.lineTo(x,base+ridge(t,1,WH*0.09,1)+Math.sin(t*2)*WH*0.05);}g.lineTo(W*2,WH);g.closePath();g.fill();
    for(let i=0;i<7;i++){const x=hash(i+1)*W*2,w=(0.03+hash(i+9)*0.03)*W,h=(0.2+hash(i+19)*0.22)*WH;g.fillStyle='#0a212c';g.beginPath();g.moveTo(x-w,WH);g.lineTo(x-w*0.6,WH-h);g.lineTo(x-w*0.1,WH-h*1.08);g.lineTo(x+w*0.5,WH-h*0.9);g.lineTo(x+w,WH);g.fill();}}
  const mid=mk(W*2,WH,0.5);{const g=mid.g;const base=WH*0.8;
    const gr=g.createLinearGradient(0,base-WH*0.2,0,WH);gr.addColorStop(0,'#0f2a33');gr.addColorStop(1,'#050e13');g.fillStyle=gr;
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=W*2;x+=6*DPR){const t=x/(W*2)*Math.PI*2;g.lineTo(x,base+ridge(t,5,WH*0.06,2));}g.lineTo(W*2,WH);g.closePath();g.fill();}
  const fg=mk(W*2,WH,1);{const g=fg.g;const base=WH*0.92;
    const gr=g.createLinearGradient(0,base-WH*0.08,0,WH);gr.addColorStop(0,'#1d3032');gr.addColorStop(0.3,'#0c1719');gr.addColorStop(1,'#030809');g.fillStyle=gr;
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=W*2;x+=4*DPR){const t=x/(W*2)*Math.PI*2;g.lineTo(x,base+ridge(t,9,WH*0.035,3));}g.lineTo(W*2,WH);g.closePath();g.fill();}
  layers.far=far;layers.mid=mid;layers.fg=fg;
  kelp.length=0;for(let i=0;i<34;i++)kelp.push({x:hash(i+200)*W*2,h:(0.18+hash(i+300)*0.24)*WH,ph:hash(i+400)*6,front:i%3===0,w:(3+hash(i+500)*3)*DPR});
}
addEventListener('resize',resize);

// ---- the pictures: the video clips (npm run art:video) and the painted profile for today's animation
const clips={};
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
async function loadClip(name){
  const res=await fetch(BASE+name+'.json');if(!res.ok)return null;
  const info=await res.json();
  const frames=await Promise.all(Array.from({length:info.frames},(_,i)=>loadImg(`${BASE}${name}/${String(i).padStart(3,'0')}.webp`)));
  return {...info,img:frames};
}
let profile=null;

// ---- settings
let video=true,showcase=false,slow=false,lampOn=true;
const LENGTHS=[6,9,18];let li=1;
const $=id=>document.getElementById(id);
$('tMode').onclick=e=>{video=!video;e.target.textContent='Animazione: '+(video?'video':'oggi');e.target.classList.toggle('on',video);restart();};
$('tPlay').onclick=e=>{showcase=!showcase;e.target.classList.toggle('on',showcase);restart();};
$('tLen').onclick=e=>{li=(li+1)%LENGTHS.length;e.target.textContent=`Lunghezza: ${LENGTHS[li]} m`;};
$('tSlow').onclick=e=>{slow=!slow;e.target.classList.toggle('on',slow);};
$('tLamp').onclick=e=>{lampOn=!lampOn;e.target.classList.toggle('on',lampOn);};

// world units: U is the prototype's unit; the diver (2 m) is about 2.6 U long, so a metre is 1.3 U... the white shark
// of the prototype (6 m) was 4.6 U: a metre is 0.767 U
const U=()=>H*0.085;
const metre=()=>U()*0.767;
const sharkLen=()=>LENGTHS[li]*metre();

const D={x:0,y:0,vx:0,vy:0,face:1,kick:0,dash:0};
// the shark: st enter/cruise/exit/bolt/hidden (patrol) or show (showcase); turning: the turn clip playing
const S={x:0,y:0,vx:0,vy:0,face:1,grow:1,phase:0,pitch:0,pitchV:0,st:'hidden',t:0.6,dy:0,onT:0,followT:0,frame:0,turn:null};
const cam={x:0,y:0};
let touch=null;
const wrap=$('wrap');
wrap.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;touch={x:e.clientX*DPR,y:e.clientY*DPR};try{wrap.setPointerCapture(e.pointerId);}catch(_){}});
wrap.addEventListener('pointermove',e=>{if(touch)touch={x:e.clientX*DPR,y:e.clientY*DPR};});
const end=()=>{touch=null;};wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
$('bDash').addEventListener('pointerdown',e=>{e.stopPropagation();D.dash=0.35;});
$('bTurn').addEventListener('pointerdown',e=>{e.stopPropagation();startTurn();});

const fish=[],snow=[];
function restart(){
  S.turn=null;S.frame=0;
  if(showcase){S.st='show';S.x=D.x+D.face*W*0.12;S.y=D.y-H*0.05;S.vx=S.face*1.2*U();S.vy=0;}
  else{S.st='hidden';S.t=0.4;}
}
function init(){
  resize();D.x=W*0.5;D.y=WH*0.45;S.x=D.x+W*0.75;S.y=D.y+H*0.08;S.face=-1;cam.x=D.x-W/2;cam.y=D.y-H/2;
  for(let i=0;i<50;i++)fish.push({x:D.x+rnd(-W*0.2,W*0.2),y:D.y+rnd(-H*0.3,H*0.2),vx:0,vy:0,ph:rnd(0,6),ox:rnd(-1,1),oy:rnd(-1,1)});
  for(let i=0;i<160;i++)snow.push({x:Math.random(),y:Math.random(),z:rnd(0.2,1.2),a:rnd(0.2,0.7)});
}
let time=0,school={x:0,y:0,t:0};

// ---- the turn of the video, in view: the shark slows down, the clip plays where it is, then it swims off the other way
function startTurn(){
  if(!video||S.turn||S.st==='hidden'||!clips.virata)return;
  const c=clips.virata,sc=sharkLen()/(c.first[2]-c.first[0]);
  // the frame placed so that the first silhouette's centre is where the shark is (mirrored when it faces left)
  const fx=(c.first[0]+c.first[2])/2,fy=(c.first[1]+c.first[3])/2;
  S.turn={t:0,face:S.face,sc,ox:S.x,oy:S.y,fx,fy};
}
function turnPose(){
  const c=clips.virata,T=S.turn,n=c.frames;
  const i=Math.min(n-1,Math.floor(T.t*c.fps*turnRate()));
  return {i,done:T.t*c.fps*turnRate()>=n};
}
const turnRate=()=>1.8; // the video's turn takes 8.5 s: played faster, about 4.7 s
function finishTurn(){
  const c=clips.virata,T=S.turn;
  // where the last silhouette is, in the world: the shark goes on from there, facing the other way
  const lx=(c.last[0]+c.last[2])/2,ly=(c.last[1]+c.last[3])/2;
  S.x=T.ox+(lx-T.fx)*T.sc*T.face;S.y=T.oy+(ly-T.fy)*T.sc;
  S.face=-T.face;S.vx=S.face*1.2*U();S.vy=0;S.turn=null;S.onT=0;S.followT=0;
  // the video's last silhouette is a little shorter (perspective): the swim starts at that size and grows back slowly
  S.grow=(c.last[2]-c.last[0])/(c.first[2]-c.first[0]);
  if(S.st!=='show')S.st='enter';
}

function update(dt){
  time+=dt;
  // diver
  if(touch){const tx=touch.x+cam.x,ty=touch.y+cam.y,dx=tx-D.x,dy=ty-D.y,d=Math.hypot(dx,dy)||1,sp=Math.min(U()*3,d*2);D.vx+=(dx/d*sp-D.vx)*Math.min(1,dt*3);D.vy+=(dy/d*sp-D.vy)*Math.min(1,dt*3);}
  else{D.vx*=Math.pow(0.2,dt);D.vy=D.vy*Math.pow(0.2,dt);}
  if(D.dash>0){D.dash-=dt;const d=Math.hypot(D.vx,D.vy)||1;D.vx+=D.vx/d*U()*14*dt;D.vy+=D.vy/d*U()*14*dt;}
  D.x+=D.vx*dt;D.y+=D.vy*dt;D.y=Math.max(H*0.1,Math.min(WH*0.86,D.y));
  if(Math.abs(D.vx)>10*DPR)D.face=D.vx>0?1:-1;D.kick+=dt*(2+Math.hypot(D.vx,D.vy)/DPR*0.05);
  updateShark(dt);
  // school
  school.t-=dt;if(school.t<=0){school.t=rnd(3,6);school.tx=D.x+rnd(-W*0.5,W*0.5);school.ty=Math.min(WH*0.8,Math.max(H*0.15,D.y+rnd(-H*0.3,H*0.3)));}
  school.x+=((school.tx||D.x)-school.x)*dt*0.4;school.y+=((school.ty||D.y)-school.y)*dt*0.4;
  for(const f of fish){let tx2=school.x+f.ox*U()*1.6+Math.sin(time*1.3+f.ph)*U()*0.3,ty2=school.y+f.oy*U()*0.8,sp=U()*1.6;
    for(const th of [D,S]){const ddx=f.x-th.x,ddy=f.y-th.y,dd=Math.hypot(ddx,ddy)||1,R=th===S?sharkLen()*0.7:U()*1.8;if(dd<R){tx2=f.x+ddx/dd*R;ty2=f.y+ddy/dd*R;sp=U()*5;}}
    const ex=tx2-f.x,ey=ty2-f.y,ed=Math.hypot(ex,ey)||1;f.vx+=(ex/ed*sp-f.vx)*Math.min(1,dt*3);f.vy+=(ey/ed*sp-f.vy)*Math.min(1,dt*3);f.x+=f.vx*dt;f.y+=f.vy*dt;}
  cam.x+=(D.x+D.face*W*0.1-W/2-cam.x)*Math.min(1,dt*3);cam.y+=(D.y-H/2-cam.y)*Math.min(1,dt*3);cam.y=Math.max(-H*0.15,Math.min(WH-H,cam.y));
}

function updateShark(dt){
  const u=U(),halfL=sharkLen()*0.55,sx=S.x-cam.x,off=sx<-halfL||sx>W+halfL;
  if(S.turn){
    // turning: it stops where it is; the clip carries it round
    S.turn.t+=dt;S.vx*=Math.pow(0.05,dt);S.vy*=Math.pow(0.05,dt);
    if(turnPose().done)finishTurn();
    advance(dt);return;
  }
  let want=0;const ty=D.y+S.dy;
  if(S.st==='show'){
    // the showcase: it swims slowly back and forth in front of you, turning in view at the edges
    const rel=(S.x-cam.x)/W;
    if(video&&((S.face>0&&rel>0.68)||(S.face<0&&rel<0.32)))startTurn();
    else if(!video&&((S.face>0&&rel>0.8)||(S.face<0&&rel<0.2)))S.face=-S.face; // today: it flips at once
    want=1.2*u;S.vx+=(S.face*want-S.vx)*Math.min(1,dt*2);S.vy+=((D.y-H*0.05-S.y)*0.6-S.vy)*Math.min(1,dt*1.5);
  } else if(S.st==='hidden'){
    S.t-=dt;S.x=S.face>0?cam.x+W+halfL*1.3:cam.x-halfL*1.3;S.y+=(ty-S.y)*Math.min(1,dt*2);S.vx=0;S.vy=0;
    if(S.t<=0){S.face=-S.face;S.st='enter';S.vx=S.face*3.5*u;S.dy=rnd(-0.22,0.22)*H;S.onT=0;S.followT=0;}
  } else {
    // the patrol of the game (CLAUDE.md), but with the video it turns in view instead of off screen
    const rel=S.face>0?sx/W:1-sx/W;
    const aheadOff=off&&((S.face>0&&sx>W)||(S.face<0&&sx<0)),behindOff=off&&!aheadOff;
    if(!off){S.onT+=dt;const following=Math.sign(D.vx)===S.face&&Math.abs(D.vx)>u*1.4;S.followT=following?S.followT+dt:Math.max(0,S.followT-dt*0.5);}
    if(S.st!=='bolt'&&(S.followT>1.1||S.onT>9))S.st='bolt';
    if(S.st==='bolt'){if(aheadOff){S.st='hidden';S.t=rnd(1.2,2.6);}else want=Math.max(14*u,Math.abs(D.vx)+11*u);}
    else if(behindOff)want=6*u;
    else if(aheadOff){S.st='hidden';S.t=rnd(0.9,2.2);}
    else if(rel<0.35){S.st='enter';want=3.5*u-(rel/0.35)*2.2*u;}
    else if(rel<0.72){S.st='cruise';want=1.7*u;}
    else if(video&&S.st==='cruise'&&Math.random()<0.7){startTurn();return;} // most passes: it turns in view
    else{S.st='exit';want=1.7*u+Math.pow((rel-0.72)/0.28,2)*6*u;}
    if(S.st!=='hidden'){S.vx+=(S.face*want-S.vx)*Math.min(1,dt*2);S.vy+=((ty-S.y)*0.8-S.vy)*Math.min(1,dt*1.5);}
  }
  if(S.st!=='hidden'){S.x+=S.vx*dt;S.y+=S.vy*dt;}
  advance(dt);
}
function advance(dt){
  const wp=Math.max(-0.4,Math.min(0.4,Math.atan2(S.vy,Math.abs(S.vx)+U()*1.5)));const np=S.pitch+(wp-S.pitch)*Math.min(1,dt*3);
  S.pitchV=(np-S.pitch)/Math.max(dt,1e-3);S.pitch=S.turn?S.pitch*(1-Math.min(1,dt*3)):np;
  // the swim's beat: faster with speed (the video swims at a cruise)
  const beat=0.7+Math.min(2.2,Math.hypot(S.vx,S.vy)/U()*0.25);
  S.frame+=dt*beat*(clips.nuoto?clips.nuoto.fps:12);
  S.grow+=(1-S.grow)*Math.min(1,dt*1.5);
  S.phase+=dt*(2.6+Math.hypot(S.vx,S.vy)/U()*0.9);
}

// ---- drawing the shark
function drawVideoShark(g){
  if(S.turn){
    const c=clips.virata,T=S.turn,im=c.img[turnPose().i];if(!im)return;
    g.save();g.translate(T.ox-cam.x,T.oy-cam.y);g.scale(T.sc*T.face,T.sc);g.drawImage(im,-T.fx,-T.fy);g.restore();return;
  }
  const c=clips.nuoto;if(!c)return;
  const im=c.img[Math.floor(S.frame)%c.frames];if(!im)return;
  const sc=(S.grow*sharkLen())/(c.first[2]-c.first[0]),cx=(c.first[0]+c.first[2])/2,cy=(c.first[1]+c.first[3])/2;
  g.save();g.translate(S.x-cam.x,S.y-cam.y);g.rotate(S.pitch*S.face);g.scale(sc*S.face,sc);g.drawImage(im,-cx,-cy);g.restore();
}
// today's animation: the painted profile on strips following the spine (as views/beastView.ts)
const N=26;
function tri(g,img,IW,IH,sx0,sy0,sx1,sy1,sx2,sy2,x0,y0,x1,y1,x2,y2){
  const cx=(x0+x1+x2)/3,cy=(y0+y1+y2)/3;
  const e=(x,y)=>{const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1;return [x+dx/d*1.2,y+dy/d*1.2];};
  const [X0,Y0]=e(x0,y0),[X1,Y1]=e(x1,y1),[X2,Y2]=e(x2,y2);
  const den=sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);if(Math.abs(den)<1e-6)return;
  g.save();g.beginPath();g.moveTo(X0,Y0);g.lineTo(X1,Y1);g.lineTo(X2,Y2);g.closePath();g.clip();
  const a=(x0*(sy1-sy2)+x1*(sy2-sy0)+x2*(sy0-sy1))/den,b=(y0*(sy1-sy2)+y1*(sy2-sy0)+y2*(sy0-sy1))/den;
  const c=(x0*(sx2-sx1)+x1*(sx0-sx2)+x2*(sx1-sx0))/den,d=(y0*(sx2-sx1)+y1*(sx0-sx2)+y2*(sx1-sx0))/den;
  const ee=(x0*(sx1*sy2-sx2*sy1)+x1*(sx2*sy0-sx0*sy2)+x2*(sx0*sy1-sx1*sy0))/den,f=(y0*(sx1*sy2-sx2*sy1)+y1*(sx2*sy0-sx0*sy2)+y2*(sx0*sy1-sx1*sy0))/den;
  g.transform(a,b,c,d,ee,f);const lx=Math.max(0,Math.floor(Math.min(sx0,sx1,sx2))-2),hx=Math.min(IW,Math.ceil(Math.max(sx0,sx1,sx2))+2);
  g.drawImage(img,lx,0,hx-lx,IH,lx,0,hx-lx,IH);g.restore();
}
function drawSpineShark(g){
  const img=profile;if(!img)return;
  const IW=img.naturalWidth,IH=img.naturalHeight,CY=IH*0.5;
  const sc=sharkLen()/IW,segL=IW/N,turn=Math.max(-1.2,Math.min(1.2,S.pitchV*0.35));
  const pts=[],ang=[];let px=0,py=0;
  for(let i=0;i<=N;i++){const u=i/N;const env=Math.pow(Math.max(0,(u-0.35)/0.65),1.5),th=1.05*env*Math.sin(S.phase-u*2.2);
    const a=S.pitch+turn*u*u*0.9+0.05*env*Math.sin(S.phase-u*2.2+1.2),len=segL*(0.62+0.38*Math.cos(th));
    ang.push(a);pts.push([px,py]);if(i<N){px-=Math.cos(a)*len;py-=Math.sin(a)*len;}}
  const mid=pts[Math.round(N*0.45)];
  g.save();g.translate(S.x-cam.x,S.y-cam.y);g.scale(sc*S.face,sc);g.translate(-mid[0],-mid[1]);
  for(let i=0;i<N;i++){const a0=i===0?ang[0]:(ang[i-1]+ang[i])/2,a1=(ang[i]+ang[i+1])/2,[x0,y0]=pts[i],[x1,y1]=pts[i+1];
    const n0x=-Math.sin(a0),n0y=Math.cos(a0),n1x=-Math.sin(a1),n1y=Math.cos(a1);
    const T0=[x0-n0x*CY,y0-n0y*CY],B0=[x0+n0x*(IH-CY),y0+n0y*(IH-CY)],T1=[x1-n1x*CY,y1-n1y*CY],B1=[x1+n1x*(IH-CY),y1+n1y*(IH-CY)];
    const s0=IW*(1-i/N),s1=IW*(1-(i+1)/N);
    tri(g,img,IW,IH,s0,0,s0,IH,s1,0,T0[0],T0[1],B0[0],B0[1],T1[0],T1[1]);tri(g,img,IW,IH,s0,IH,s1,IH,s1,0,B0[0],B0[1],B1[0],B1[1],T1[0],T1[1]);}
  g.restore();
}
function drawDiver(g){
  const x=D.x-cam.x,y=D.y-cam.y,k=Math.sin(D.kick*5),s=(2*metre())/3.5; // the diver: 2 m, fins to mask
  g.save();g.translate(x,y);g.scale(D.face*s,s);
  g.fillStyle='#2a3b42';g.beginPath();g.moveTo(-1.7,-0.05);g.lineTo(-2.5,-0.35+k*0.25);g.lineTo(-2.45,0.1+k*0.25);g.closePath();g.fill();
  g.beginPath();g.moveTo(-1.7,0.1);g.lineTo(-2.45,0.35-k*0.25);g.lineTo(-2.5,0.6-k*0.25);g.closePath();g.fill();
  g.fillStyle='#3a525c';g.beginPath();g.ellipse(-1.2,0.12,0.55,0.16,0,0,Math.PI*2);g.fill();
  const bg2=g.createLinearGradient(0,-0.25,0,0.3);bg2.addColorStop(0,'#6f8d97');bg2.addColorStop(0.45,'#3f5a64');bg2.addColorStop(1,'#1f3139');g.fillStyle=bg2;g.beginPath();g.ellipse(-0.1,0.05,0.75,0.27,0,0,Math.PI*2);g.fill();
  const tg=g.createLinearGradient(0,-0.45,0,-0.15);tg.addColorStop(0,'#e0a84a');tg.addColorStop(1,'#8a5a1e');g.fillStyle=tg;g.beginPath();if(g.roundRect)g.roundRect(-0.65,-0.43,0.95,0.24,0.1);else g.rect(-0.65,-0.43,0.95,0.24);g.fill();
  g.fillStyle='#4a6570';g.beginPath();g.arc(0.72,-0.02,0.22,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(143,227,240,0.9)';g.beginPath();g.ellipse(0.83,-0.03,0.09,0.12,0,0,Math.PI*2);g.fill();
  g.restore();
}
function drawKelp(g,front){
  for(const k of kelp){if(k.front!==front)continue;const par=front?1.25:0.8,wx=(((k.x-cam.x*par)%(W*2))+W*2)%(W*2)-W*0.25;if(wx<-100||wx>W+100)continue;
    const by=WH*0.93-cam.y*(front?1:0.9);g.strokeStyle=front?'#081410':'#133a2e';g.lineWidth=k.w*(front?1.6:1);g.lineCap='round';g.beginPath();g.moveTo(wx,by);
    for(let s=0;s<=1.001;s+=0.08){const sway=Math.sin(time*0.9+k.ph+s*2.5)*s*28*DPR;g.lineTo(wx+sway,by-s*k.h);}g.stroke();}
}
function drawLayer(g,L,par){const w=L.w,off=(((cam.x*par)%w)+w)%w,yo=-cam.y*(par*0.9+0.1);
  for(let x=-off;x<W;x+=w)g.drawImage(L.c,0,0,L.c.width,L.c.height,x,yo,w,L.h);}
function drawScene(g){
  const depth=Math.max(0,Math.min(1,(cam.y+H/2)/WH));
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgb(${18-12*depth|0},${70-50*depth|0},${88-60*depth|0})`);gr.addColorStop(1,`rgb(4,${16-8*depth|0},${24-12*depth|0})`);g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(150,210,225,${0.05*(1-depth)})`;
  for(let i=0;i<6;i++){const x=((i*0.19+time*0.003-cam.x/W*0.1)%1.2+1.2)%1.2*W-0.1*W;g.beginPath();g.moveTo(x,0);g.lineTo(x+W*0.04,0);g.lineTo(x+W*0.16,H);g.lineTo(x+W*0.09,H);g.closePath();g.fill();}g.restore();
  drawLayer(g,layers.far,0.3);drawLayer(g,layers.mid,0.6);drawKelp(g,false);
  for(const s of snow){const x=((s.x*W-cam.x*s.z*0.5)%W+W)%W,y=((s.y*H-cam.y*s.z*0.5+time*8*DPR*s.z)%H+H)%H;g.fillStyle=`rgba(190,215,220,${s.a*0.5})`;const r=s.z*1.6*DPR;g.fillRect(x,y,r,r);}
  for(const f of fish){const x=f.x-cam.x,y=f.y-cam.y;if(x<-20||x>W+20)continue;const a=Math.atan2(f.vy,f.vx);g.save();g.translate(x,y);g.rotate(a);
    const Lf=U()*0.2,hh=Lf*0.22,sh=0.5+0.5*Math.sin(a*2+time*3+f.ph);
    g.fillStyle=`rgb(${120+90*sh|0},${150+70*sh|0},${160+60*sh|0})`;g.beginPath();g.ellipse(0,0,Lf,hh,0,0,Math.PI*2);g.fill();
    g.beginPath();g.moveTo(-Lf*0.9,0);g.lineTo(-Lf*1.25,-hh*1.1);g.lineTo(-Lf*1.25,hh*1.1);g.closePath();g.fill();g.restore();}
  if(S.st!=='hidden')(video?drawVideoShark:drawSpineShark)(g);
  drawDiver(g);
  drawLayer(g,layers.fg,1);drawKelp(g,true);
  // darkness + lamp (as in the game: deeper is darker)
  const lw=lightC.width,lh=lightC.height,k=lw/W;
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,lw,lh);lg.fillStyle=`rgba(0,4,9,${0.22+0.55*depth})`;lg.fillRect(0,0,lw,lh);
  lg.globalCompositeOperation='destination-out';
  const dx=(D.x-cam.x)*k,dy=(D.y-cam.y)*k,halo=lg.createRadialGradient(dx,dy,0,dx,dy,U()*1.1*k);halo.addColorStop(0,'rgba(0,0,0,.95)');halo.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=halo;lg.fillRect(0,0,lw,lh);
  if(lampOn){lg.save();lg.translate(dx+D.face*U()*0.3*k,dy+U()*0.08*k);lg.scale(D.face,1);const L=W*0.42*k,cg=lg.createRadialGradient(0,0,0,0,0,L);cg.addColorStop(0,'rgba(0,0,0,1)');cg.addColorStop(0.6,'rgba(0,0,0,.7)');cg.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=cg;lg.beginPath();lg.moveTo(0,0);lg.arc(0,0,L,-0.42,0.42);lg.closePath();lg.fill();lg.restore();}
  g.imageSmoothingEnabled=true;g.drawImage(lightC,0,0,lw,lh,0,0,W,H);
  if(lampOn){g.save();g.globalCompositeOperation='lighter';g.translate(D.x-cam.x+D.face*U()*0.3,D.y-cam.y+U()*0.08);g.scale(D.face,1);const L=W*0.4,wg=g.createRadialGradient(0,0,0,0,0,L);wg.addColorStop(0,'rgba(255,200,140,0.16)');wg.addColorStop(1,'rgba(255,200,140,0)');g.fillStyle=wg;g.beginPath();g.moveTo(0,0);g.arc(0,0,L,-0.4,0.4);g.closePath();g.fill();g.restore();}
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');g.fillStyle=vg;g.fillRect(0,0,W,H);
}
let last=performance.now(),fpsT=0,fpsN=0,fps=0;
function frame(now){
  const real=Math.min(0.05,(now-last)/1000);last=now;
  update(real*(slow?0.25:1));drawScene(ctx);
  fpsN++;fpsT+=real;if(fpsT>=1){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;
    $('info').textContent=`${fps} fps · ${video?'video: nuoto '+(clips.nuoto?.frames??0)+' fotogrammi, virata '+(clips.virata?.frames??0):'oggi: immagine a strisce sulla spina dorsale'} · ${showcase?'vetrina':'pattuglia'}`;}
  requestAnimationFrame(frame);
}
(async()=>{
  init();
  const [n,v,p]=await Promise.all([loadClip('nuoto'),loadClip('virata'),loadImg(BASE+'profilo.webp')]);
  if(n)clips.nuoto=n;if(v)clips.virata=v;profile=p;
  $('load').remove();restart();requestAnimationFrame(frame);
})();
</script>
