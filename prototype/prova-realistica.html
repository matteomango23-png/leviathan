<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Leviatano, prova realistica 2</title>
<style>
:root{
  --bg:#02070c; --ink:#e6ede8; --muted:#8fa7ad; --lamp:#ffd9a0; --glow:#5ff3d6; --blood:#c9443f; --panel:rgba(3,12,19,.7); --line:rgba(176,138,74,.55);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#02070c; } }
:root[data-theme="dark"]{ --bg:#02070c; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Helvetica Neue',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:calc(12px + env(safe-area-inset-left,0px));pointer-events:none;display:flex;flex-direction:column;gap:5px}
#hearts{color:var(--blood);font-size:16px;letter-spacing:2px;text-shadow:0 1px 2px #000}
#o2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#o2 div{width:96px;height:6px;border:1px solid var(--line);background:rgba(0,0,0,.5)}
#o2 i{display:block;height:100%;width:72%;background:var(--glow);box-shadow:0 0 6px var(--glow)}
#depth{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#tools{position:absolute;top:8px;right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px}
.tb{font:600 12px -apple-system,system-ui,sans-serif;color:var(--lamp);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 9px}
.tb.on{background:rgba(176,138,74,.35);color:#fff}
#btns{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:16px;display:flex;gap:12px;align-items:flex-end}
.act{border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(46,66,74,.55),rgba(3,10,16,.8));border:2px solid rgba(176,138,74,.8);color:var(--lamp);font:700 12px -apple-system,system-ui,sans-serif}
#bDash{width:58px;height:58px}
#bBite{width:76px;height:76px}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--muted);text-shadow:0 1px 3px #000;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><div id="hearts">♥♥♥♥♥</div><div id="o2"><span>O₂</span><div><i></i></div></div><div id="depth">0 m</div></div>
  <div id="tools"><button class="tb on" id="tLamp">Lampada</button><button class="tb" id="tZoom">Telecamera: lontana</button><button class="tb" id="tVar">Squalo: normale</button></div>
  <div id="btns"><button class="act" id="bDash">Scatto</button><button class="act" id="bBite">Morso squalo</button></div>
  <div id="hint">Tieni premuto e trascina per nuotare</div>
</div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const low=document.createElement('canvas'),lowc=low.getContext('2d');
const lightC=document.createElement('canvas'),lg=lightC.getContext('2d');
let W=0,H=0,DPR=1;
const layers={};
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=Math.round(innerWidth*DPR);H=Math.round(innerHeight*DPR);
  cv.width=W;cv.height=H;low.width=Math.ceil(W/3);low.height=Math.ceil(H/3);lightC.width=Math.ceil(W/2);lightC.height=Math.ceil(H/2);
  buildLayers();
}
// world: infinite horizontally (tiled layers), vertical 0 (surface) .. WH (seabed)
let WH=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
function ridge(x,seed,amp,freq){let y=0;for(let o=1;o<=4;o++){y+=Math.sin(x*freq*o*1.7+seed*o*3.1+Math.sin(x*freq*0.5*o+seed))*amp/o;}return y;}
function buildLayers(){
  WH=H*1.6;
  const mk=(w,h,s)=>{const c=document.createElement('canvas');c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);const g=c.getContext('2d');g.scale(s,s);return {c,g,w,h,s};};
  // far rocks (parallax 0.3), half resolution
  const far=mk(W*2,WH,0.5);{const g=far.g;const base=WH*0.62;
    const gr=g.createLinearGradient(0,base-WH*0.3,0,WH);gr.addColorStop(0,'#0b2531');gr.addColorStop(1,'#04111a');g.fillStyle=gr;
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=W*2;x+=8*DPR){const t=x/(W*2)*Math.PI*2;g.lineTo(x,base+ridge(t,1,WH*0.09,1)+Math.sin(t*2)*WH*0.05);}g.lineTo(W*2,WH);g.closePath();g.fill();
    for(let i=0;i<7;i++){const x=hash(i+1)*W*2,w=rnd(0.03,0.06)*W,h=rnd(0.2,0.42)*WH;g.fillStyle='#0a212c';g.beginPath();g.moveTo(x-w,WH);g.lineTo(x-w*0.6,WH-h);g.lineTo(x-w*0.1,WH-h*1.08);g.lineTo(x+w*0.5,WH-h*0.9);g.lineTo(x+w,WH);g.fill();}}
  // mid rocks (parallax 0.6)
  const mid=mk(W*2,WH,0.5);{const g=mid.g;const base=WH*0.8;
    const gr=g.createLinearGradient(0,base-WH*0.2,0,WH);gr.addColorStop(0,'#0f2a33');gr.addColorStop(1,'#050e13');g.fillStyle=gr;
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=W*2;x+=6*DPR){const t=x/(W*2)*Math.PI*2;g.lineTo(x,base+ridge(t,5,WH*0.06,2));}g.lineTo(W*2,WH);g.closePath();g.fill();
    for(let i=0;i<12;i++){const x=hash(i+30)*W*2,y=base+ridge(x/(W*2)*Math.PI*2,5,WH*0.06,2),r=rnd(0.02,0.05)*W;
      const rg=g.createRadialGradient(x-r*0.3,y-r*0.4,r*0.1,x,y,r);rg.addColorStop(0,'#1d3a42');rg.addColorStop(1,'#08161c');g.fillStyle=rg;g.beginPath();
      for(let a=0;a<=Math.PI*2+0.01;a+=0.3){const rr=r*(0.8+0.25*Math.sin(a*3+i));g.lineTo(x+Math.cos(a)*rr*1.3,y+Math.sin(a)*rr*0.8);}g.fill();}}
  // foreground seabed (parallax 1), full res
  const fg=mk(W*2,WH,1);{const g=fg.g;const base=WH*0.92;
    const gr=g.createLinearGradient(0,base-WH*0.08,0,WH);gr.addColorStop(0,'#1d3032');gr.addColorStop(0.3,'#0c1719');gr.addColorStop(1,'#030809');g.fillStyle=gr;
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=W*2;x+=4*DPR){const t=x/(W*2)*Math.PI*2;g.lineTo(x,base+ridge(t,9,WH*0.035,3));}g.lineTo(W*2,WH);g.closePath();g.fill();
    for(let i=0;i<2400;i++){const x=hash(i*1.3)*W*2,y=base+hash(i*2.7)*WH*0.08+ridge(x/(W*2)*Math.PI*2,9,WH*0.035,3);g.fillStyle=hash(i*5.1)>0.5?'rgba(120,140,130,0.18)':'rgba(0,0,0,0.3)';g.fillRect(x,y,1.5*DPR,1.5*DPR);}
    const cols=['#7a3634','#8a5a2c','#6e4a5e','#4d6b63'];
    for(let i=0;i<26;i++){const x=hash(i+70)*W*2,y=base+ridge(x/(W*2)*Math.PI*2,9,WH*0.035,3)+2*DPR;g.strokeStyle=cols[i%4];g.lineWidth=1.6*DPR;g.lineCap='round';
      const br=(x0,y0,a,len,d)=>{if(d>4||len<3*DPR)return;const x1=x0+Math.cos(a)*len,y1=y0+Math.sin(a)*len;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();br(x1,y1,a-0.45,len*0.72,d+1);br(x1,y1,a+0.4,len*0.7,d+1);};
      br(x,y,-Math.PI/2+rnd(-0.2,0.2),rnd(10,22)*DPR,0);}}
  layers.far=far;layers.mid=mid;layers.fg=fg;
  kelp.length=0;for(let i=0;i<34;i++)kelp.push({x:hash(i+200)*W*2,h:rnd(0.18,0.42)*WH,ph:rnd(0,6),front:i%3===0,w:rnd(3,6)*DPR});
}
const kelp=[];
addEventListener('resize',resize);

// ---- shark sprite and mesh
const mkI=p=>{const i=new Image();i.src=p;return i;}; // in the kit: images live in public/sprites/
const VARS=[
  {name:'normale',sz:1,c:mkI('../public/sprites/squalo_bianco.webp'),o:mkI('../public/sprites/squalo_bianco_open.webp')},
  {name:'alfa (1,15×)',sz:1.15,c:mkI('../public/sprites/squalo_bianco_alfa.webp'),o:mkI('../public/sprites/squalo_bianco_alfa_open.webp')},
  {name:'albino',sz:1,c:mkI('../public/sprites/squalo_bianco_albino.webp'),o:mkI('../public/sprites/squalo_bianco_albino_open.webp')},
  {name:'Sfregiato (1,25×)',sz:1.25,c:mkI('../public/sprites/sfregiato.webp'),o:mkI('../public/sprites/sfregiato_open.webp')},
  {name:'Titano, forma finale (1,5×)',sz:1.5,c:mkI('../public/sprites/squalo_bianco_finale.webp'),o:mkI('../public/sprites/squalo_bianco_finale_open.webp')},
  {name:'Mega albino, forma finale (1,5×)',sz:1.5,c:mkI('../public/sprites/squalo_bianco_albino_finale.webp'),o:mkI('../public/sprites/squalo_bianco_albino_finale_open.webp')}];
let vi=0,img=VARS[0].c;
const IW=1000,IH=460,CY=250,N=26;
let lampOn=true,pixel=false,far=true;
document.getElementById('tLamp').onclick=e=>{lampOn=!lampOn;e.target.classList.toggle('on',lampOn);};
document.getElementById('tVar').onclick=e=>{vi=(vi+1)%VARS.length;e.target.textContent='Squalo: '+VARS[vi].name;};
document.getElementById('tZoom').onclick=e=>{far=!far;e.target.textContent='Telecamera: '+(far?'lontana':'vicina');};


const D={x:0,y:0,vx:0,vy:0,face:1,kick:0,dash:0}; // diver (world px)
const S={x:0,y:0,vx:0,vy:0,face:1,turnT:1,from:1,phase:0,pitch:0,pitchV:0,lunge:0,orbit:0,shake:0,st:'enter',t:0,dy:0,onT:0,followT:0,jaw:0,snapCD:0};
const cam={x:0,y:0};
let touch=null;
const wrap=document.getElementById('wrap');
wrap.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;touch={x:e.clientX*DPR,y:e.clientY*DPR};try{wrap.setPointerCapture(e.pointerId);}catch(_){}});
wrap.addEventListener('pointermove',e=>{if(touch)touch={x:e.clientX*DPR,y:e.clientY*DPR};});
const end=()=>{touch=null;};wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
document.getElementById('bDash').addEventListener('pointerdown',e=>{e.stopPropagation();D.dash=0.35;});
document.getElementById('bBite').addEventListener('pointerdown',e=>{e.stopPropagation();S.lunge=0.35;S.shake=9*DPR;});

const fish=[];const snow=[];const blood=[];
function init(){
  resize();D.x=W*0.5;D.y=WH*0.45;S.x=D.x+W*0.75;S.y=D.y+H*0.08;S.face=-1;S.st='hidden';S.t=0.6;cam.x=D.x-W/2;cam.y=D.y-H/2;
  for(let i=0;i<60;i++)fish.push({x:D.x+rnd(-W*0.2,W*0.2),y:D.y+rnd(-H*0.3,H*0.2),vx:0,vy:0,ph:rnd(0,6),ox:rnd(-1,1),oy:rnd(-1,1)});
  for(let i=0;i<160;i++)snow.push({x:Math.random(),y:Math.random(),z:rnd(0.2,1.2),a:rnd(0.2,0.7)});
}
const U=()=>H*(far?0.085:0.15);
const sharkScale=()=>4.6*U()/IW;
let time=0,school={x:0,y:0,t:0};

function update(dt){
  time+=dt;
  // diver
  if(touch){const tx=touch.x+cam.x,ty=touch.y+cam.y,dx=tx-D.x,dy=ty-D.y,d=Math.hypot(dx,dy)||1,sp=Math.min(U()*3,d*2);D.vx+=(dx/d*sp-D.vx)*Math.min(1,dt*3);D.vy+=(dy/d*sp-D.vy)*Math.min(1,dt*3);}
  else{D.vx*=Math.pow(0.2,dt);D.vy=D.vy*Math.pow(0.2,dt)+6*DPR*dt;}
  if(D.dash>0){D.dash-=dt;const d=Math.hypot(D.vx,D.vy)||1;D.vx+=D.vx/d*U()*14*dt;D.vy+=D.vy/d*U()*14*dt;}
  D.x+=D.vx*dt;D.y+=D.vy*dt;D.y=Math.max(H*0.1,Math.min(WH*0.86,D.y));
  if(Math.abs(D.vx)>10*DPR)D.face=D.vx>0?1:-1;D.kick+=dt*(2+Math.hypot(D.vx,D.vy)/DPR*0.05);
  // shark orbits the diver with passes
  {
    const u=U(),halfL=2.4*u*VARS[vi].sz,sx=S.x-cam.x,off=sx<-halfL||sx>W+halfL;
    const aheadOff=off&&((S.face>0&&sx>W)||(S.face<0&&sx<0)),behindOff=off&&!aheadOff;
    const ty=D.y+S.dy;let want=0;
    if(S.st==='hidden'){
      S.t-=dt;S.x=S.face>0?cam.x+W+halfL*1.3:cam.x-halfL*1.3;S.y+=(ty-S.y)*Math.min(1,dt*2);S.vx=0;S.vy=0;
      if(S.t<=0){S.face=-S.face;S.st='enter';S.vx=S.face*3.5*u;S.dy=rnd(-0.22,0.22)*H;S.onT=0;S.followT=0;}
    } else {
      const rel=S.face>0?sx/W:1-sx/W;
      if(!off){S.onT+=dt;const following=Math.sign(D.vx)===S.face&&Math.abs(D.vx)>u*1.4;S.followT=following?S.followT+dt:Math.max(0,S.followT-dt*0.5);}
      if(S.st!=='bolt'&&(S.followT>1.1||S.onT>9))S.st='bolt'; // followed or lingering too long: bolt away
      if(S.st==='bolt'){if(aheadOff){S.st='hidden';S.t=rnd(1.2,2.6);}else want=Math.max(14*u,Math.abs(D.vx)+11*u);}
      else if(behindOff)want=6*u;
      else if(aheadOff){S.st='hidden';S.t=rnd(0.9,2.2);}
      else if(rel<0.35){S.st='enter';want=3.5*u-(rel/0.35)*2.2*u;}
      else if(rel<0.72){S.st='cruise';want=1.7*u;}
      else {S.st='exit';want=1.7*u+Math.pow((rel-0.72)/0.28,2)*6*u;}
      if(S.lunge>0)want=Math.max(want,8*u);
      if(S.st!=='hidden'){S.vx+=(S.face*want-S.vx)*Math.min(1,dt*2);S.vy+=((ty-S.y)*0.8-S.vy)*Math.min(1,dt*1.5);}
    }
  }
  if(S.lunge>0){S.lunge-=dt;if(Math.random()<0.5)blood.push({x:S.x+S.face*IW*sharkScale()*0.5,y:S.y,vx:rnd(-40,40)*DPR,vy:rnd(-30,30)*DPR,l:1});}
  if(S.st!=='hidden'){S.x+=S.vx*dt;S.y+=S.vy*dt;}
  const wp=Math.max(-0.4,Math.min(0.4,Math.atan2(S.vy,Math.abs(S.vx)+U()*1.5)));const np=S.pitch+(wp-S.pitch)*Math.min(1,dt*3);S.pitchV=(np-S.pitch)/Math.max(dt,1e-3);S.pitch=np;
  S.jaw=Math.max(0,S.jaw-dt);S.snapCD-=dt;if(S.lunge>0)S.jaw=0.25;
  if(S.st!=='hidden'&&S.snapCD<=0&&Math.hypot(S.x+S.face*2*U()-D.x,S.y-D.y)<U()*2.2){S.jaw=0.45;S.snapCD=2.5;}
  S.phase+=dt*(2.6+Math.hypot(S.vx,S.vy)/U()*0.9+(S.lunge>0?6:0));S.shake=Math.max(0,S.shake-dt*40*DPR);
  // school
  school.t-=dt;if(school.t<=0){school.t=rnd(3,6);school.tx=D.x+rnd(-W*0.5,W*0.5);school.ty=Math.min(WH*0.8,Math.max(H*0.15,D.y+rnd(-H*0.3,H*0.3)));}
  school.x+=((school.tx||D.x)-school.x)*dt*0.4;school.y+=((school.ty||D.y)-school.y)*dt*0.4;
  for(const f of fish){let tx2=school.x+f.ox*U()*1.6+Math.sin(time*1.3+f.ph)*U()*0.3,ty2=school.y+f.oy*U()*0.8,sp=U()*1.6;
    for(const th of [D,S]){const ddx=f.x-th.x,ddy=f.y-th.y,dd=Math.hypot(ddx,ddy)||1,R=th===S?U()*3.5:U()*1.8;if(dd<R){tx2=f.x+ddx/dd*R;ty2=f.y+ddy/dd*R;sp=U()*5;}}
    const ex=tx2-f.x,ey=ty2-f.y,ed=Math.hypot(ex,ey)||1;f.vx+=(ex/ed*sp-f.vx)*Math.min(1,dt*3);f.vy+=(ey/ed*sp-f.vy)*Math.min(1,dt*3);f.x+=f.vx*dt;f.y+=f.vy*dt;}
  for(let i=blood.length-1;i>=0;i--){const b=blood[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=0.95;b.vy*=0.95;b.l-=dt;if(b.l<=0)blood.splice(i,1);}
  // camera
  cam.x+=(D.x+D.face*W*0.1-W/2-cam.x)*Math.min(1,dt*3);cam.y+=(D.y-H/2-cam.y)*Math.min(1,dt*3);cam.y=Math.max(-H*0.15,Math.min(WH-H,cam.y));
  document.getElementById('depth').textContent=Math.max(0,Math.round(D.y/DPR*0.15))+' m';
}

function tri(g,sx0,sy0,sx1,sy1,sx2,sy2,x0,y0,x1,y1,x2,y2){
  const cx=(x0+x1+x2)/3,cy=(y0+y1+y2)/3;
  const e=(x,y)=>{const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1;return [x+dx/d*1.2,y+dy/d*1.2];};
  const [X0,Y0]=e(x0,y0),[X1,Y1]=e(x1,y1),[X2,Y2]=e(x2,y2);
  const den=sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);if(Math.abs(den)<1e-6)return;
  g.save();g.beginPath();g.moveTo(X0,Y0);g.lineTo(X1,Y1);g.lineTo(X2,Y2);g.closePath();g.clip();
  const a=(x0*(sy1-sy2)+x1*(sy2-sy0)+x2*(sy0-sy1))/den,b=(y0*(sy1-sy2)+y1*(sy2-sy0)+y2*(sy0-sy1))/den;
  const c=(x0*(sx2-sx1)+x1*(sx0-sx2)+x2*(sx1-sx0))/den,d=(y0*(sx2-sx1)+y1*(sx0-sx2)+y2*(sx1-sx0))/den;
  const ee=(x0*(sx1*sy2-sx2*sy1)+x1*(sx2*sy0-sx0*sy2)+x2*(sx0*sy1-sx1*sy0))/den,f=(y0*(sx1*sy2-sx2*sy1)+y1*(sx2*sy0-sx0*sy2)+y2*(sx0*sy1-sx1*sy0))/den;
  g.transform(a,b,c,d,ee,f);const lx=Math.max(0,Math.floor(Math.min(sx0,sx1,sx2))-2),hx=Math.min(IW,Math.ceil(Math.max(sx0,sx1,sx2))+2);
  g.drawImage(img,lx,0,hx-lx,IH,lx,0,hx-lx,IH);g.restore();
}
const smooth=t=>t*t*(3-2*t);
function drawShark(g){
  const V=VARS[vi];img=(S.jaw>0&&V.o)?V.o:V.c;
  if(!img.complete||!img.naturalWidth||S.st==='hidden')return;
  const sc=sharkScale()*VARS[vi].sz,segL=IW/N,turn=Math.max(-1.2,Math.min(1.2,S.pitchV*0.35));
  // per-node facing: during a turn the head flips first and the body follows
  const fac=u=>S.face;const arc=0;
  const pts=[],ang=[],fs=[];let px=0,py=0;
  for(let i=0;i<=N;i++){const u=i/N;const env=Math.pow(Math.max(0,(u-0.35)/0.65),1.5),th=1.05*env*Math.sin(S.phase-u*2.2);
    const a=S.pitch+arc+turn*u*u*0.9+0.05*env*Math.sin(S.phase-u*2.2+1.2),len=segL*(0.62+0.38*Math.cos(th)),f=fac(u);
    ang.push(a);fs.push(f);pts.push([px,py]);if(i<N){const fm=(f+fac((i+1)/N))/2;px-=Math.cos(a)*len*fm;py-=Math.sin(a)*len;}}
  const mid=pts[Math.round(N*0.45)];
  g.save();g.translate(S.x-cam.x+(Math.random()-.5)*S.shake,S.y-cam.y+(Math.random()-.5)*S.shake);g.scale(sc,sc);g.translate(-mid[0],-mid[1]);
  for(let i=0;i<N;i++){const a0=i===0?ang[0]:(ang[i-1]+ang[i])/2,a1=(ang[i]+ang[i+1])/2,[x0,y0]=pts[i],[x1,y1]=pts[i+1];
    const n0x=-Math.sin(a0)*fs[i],n0y=Math.cos(a0),n1x=-Math.sin(a1)*fs[i+1],n1y=Math.cos(a1);
    const T0=[x0-n0x*CY,y0-n0y*CY],B0=[x0+n0x*(IH-CY),y0+n0y*(IH-CY)],T1=[x1-n1x*CY,y1-n1y*CY],B1=[x1+n1x*(IH-CY),y1+n1y*(IH-CY)];
    const s0=IW*(1-i/N),s1=IW*(1-(i+1)/N);
    tri(g,s0,0,s0,IH,s1,0,T0[0],T0[1],B0[0],B0[1],T1[0],T1[1]);tri(g,s0,IH,s1,IH,s1,0,B0[0],B0[1],B1[0],B1[1],T1[0],T1[1]);}
  // darken the body while it faces the camera mid-turn
  g.restore();
}
function drawDiver(g){
  const x=D.x-cam.x,y=D.y-cam.y,k=Math.sin(D.kick*5),s=U()/3.6;
  g.save();g.translate(x,y);g.scale(D.face*s,s);g.rotate(Math.max(-0.5,Math.min(0.5,Math.atan2(D.vy,Math.abs(D.vx)+30*DPR)))*D.face*0);
  g.fillStyle='#2a3b42';g.beginPath();g.moveTo(-1.7,-0.05);g.lineTo(-2.5,-0.35+k*0.25);g.lineTo(-2.45,0.1+k*0.25);g.closePath();g.fill();
  g.beginPath();g.moveTo(-1.7,0.1);g.lineTo(-2.45,0.35-k*0.25);g.lineTo(-2.5,0.6-k*0.25);g.closePath();g.fill();
  g.fillStyle='#3a525c';g.beginPath();g.ellipse(-1.2,0.12,0.55,0.16,0,0,Math.PI*2);g.fill();
  const bg2=g.createLinearGradient(0,-0.25,0,0.3);bg2.addColorStop(0,'#6f8d97');bg2.addColorStop(0.45,'#3f5a64');bg2.addColorStop(1,'#1f3139');g.fillStyle=bg2;g.beginPath();g.ellipse(-0.1,0.05,0.75,0.27,0,0,Math.PI*2);g.fill();
  const tg=g.createLinearGradient(0,-0.45,0,-0.15);tg.addColorStop(0,'#e0a84a');tg.addColorStop(1,'#8a5a1e');g.fillStyle=tg;g.beginPath();if(g.roundRect)g.roundRect(-0.65,-0.43,0.95,0.24,0.1);else g.rect(-0.65,-0.43,0.95,0.24);g.fill();
  g.fillStyle='#4a6570';g.beginPath();g.arc(0.72,-0.02,0.22,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(143,227,240,0.9)';g.beginPath();g.ellipse(0.83,-0.03,0.09,0.12,0,0,Math.PI*2);g.fill();
  g.strokeStyle='#4a6570';g.lineWidth=0.13;g.lineCap='round';g.beginPath();g.moveTo(0.3,0.15);g.lineTo(0.95,0.28);g.stroke();
  g.fillStyle='#fff1c2';g.beginPath();g.arc(1.02,0.29,0.07,0,Math.PI*2);g.fill();
  g.restore();
}
function drawKelp(g,front){
  for(const k of kelp){if(k.front!==front)continue;const par=front?1.25:0.8,wx=(((k.x-cam.x*par)%(W*2))+W*2)%(W*2)-W*0.25;if(wx<-100||wx>W+100)continue;
    const by=WH*0.93-cam.y*(front?1:0.9);g.strokeStyle=front?'#081410':'#133a2e';g.lineWidth=k.w*(front?1.6:1);g.lineCap='round';g.beginPath();g.moveTo(wx,by);
    for(let s=0;s<=1.001;s+=0.08){const sway=Math.sin(time*0.9+k.ph+s*2.5)*s*28*DPR;g.lineTo(wx+sway,by-s*k.h);}g.stroke();
    if(!front){g.fillStyle='#16473a';for(let s=0.15;s<1;s+=0.14){const sway=Math.sin(time*0.9+k.ph+s*2.5)*s*28*DPR;g.beginPath();g.ellipse(wx+sway+6*DPR,by-s*k.h,7*DPR,2.5*DPR,0.5,0,Math.PI*2);g.fill();}}}
}
function drawLayer(g,L,par){const w=L.w,off=(((cam.x*par)%w)+w)%w,yo=-cam.y*(par*0.9+0.1);
  for(let x=-off;x<W;x+=w)g.drawImage(L.c,0,0,L.c.width,L.c.height,x,yo,w,L.h);}
function drawScene(g){
  const depth=Math.max(0,Math.min(1,(cam.y+H/2)/WH));
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgb(${18-12*depth|0},${70-50*depth|0},${88-60*depth|0})`);gr.addColorStop(1,`rgb(${4},${16-8*depth|0},${24-12*depth|0})`);g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(150,210,225,${0.05*(1-depth)})`;
  for(let i=0;i<6;i++){const x=((i*0.19+time*0.003-cam.x/W*0.1)%1.2+1.2)%1.2*W-0.1*W;g.beginPath();g.moveTo(x,0);g.lineTo(x+W*0.04,0);g.lineTo(x+W*0.16,H);g.lineTo(x+W*0.09,H);g.closePath();g.fill();}g.restore();
  drawLayer(g,layers.far,0.3);drawLayer(g,layers.mid,0.6);drawKelp(g,false);
  for(const s of snow){const x=((s.x*W-cam.x*s.z*0.5)%W+W)%W,y=((s.y*H-cam.y*s.z*0.5+time*8*DPR*s.z)%H+H)%H;g.fillStyle=`rgba(190,215,220,${s.a*0.5})`;const r=s.z*1.6*DPR;g.fillRect(x,y,r,r);}
  for(const f of fish){const x=f.x-cam.x,y=f.y-cam.y;if(x<-20||x>W+20)continue;const a=Math.atan2(f.vy,f.vx);g.save();g.translate(x,y);g.rotate(a);
    const Lf=U()*0.2,hh=Lf*0.22,sh=0.5+0.5*Math.sin(a*2+time*3+f.ph),tw=Math.sin(time*16+f.ph)*hh*0.5;
    const fg2=g.createLinearGradient(0,-hh,0,hh);fg2.addColorStop(0,'#24424d');fg2.addColorStop(0.45,`rgb(${150+90*sh|0},${175+70*sh|0},${185+60*sh|0})`);fg2.addColorStop(1,'#8aa3ab');g.fillStyle=fg2;
    g.beginPath();g.moveTo(Lf,0);g.quadraticCurveTo(Lf*0.6,-hh,0,-hh*0.95);g.quadraticCurveTo(-Lf*0.55,-hh*0.7,-Lf*0.8,tw*0.3);g.quadraticCurveTo(-Lf*0.55,hh*0.75,0,hh);g.quadraticCurveTo(Lf*0.6,hh*0.9,Lf,0);g.fill();
    g.beginPath();g.moveTo(-Lf*0.75,tw*0.3);g.lineTo(-Lf*1.1,-hh*1.1+tw);g.lineTo(-Lf*0.95,tw);g.lineTo(-Lf*1.1,hh*1.1+tw);g.closePath();g.fillStyle='#6f8b95';g.fill();
    g.fillStyle='#08141a';g.fillRect(Lf*0.62,-hh*0.25,Math.max(1,Lf*0.1),Math.max(1,Lf*0.1));g.restore();}
  drawShark(g);
  g.fillStyle='rgba(150,20,20,0.85)';for(const b of blood){g.globalAlpha=Math.min(1,b.l);g.beginPath();g.arc(b.x-cam.x,b.y-cam.y,2.2*DPR,0,Math.PI*2);g.fill();}g.globalAlpha=1;
  drawDiver(g);
  drawLayer(g,layers.fg,1);drawKelp(g,true);
  // darkness + lamp
  const lw=lightC.width,lh=lightC.height,k=lw/W;
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,lw,lh);lg.fillStyle=`rgba(0,4,9,${0.22+0.55*depth})`;lg.fillRect(0,0,lw,lh);
  lg.globalCompositeOperation='destination-out';
  const dx=(D.x-cam.x)*k,dy=(D.y-cam.y)*k,halo=lg.createRadialGradient(dx,dy,0,dx,dy,U()*1.1*k);halo.addColorStop(0,'rgba(0,0,0,.95)');halo.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=halo;lg.fillRect(0,0,lw,lh);
  if(lampOn){lg.save();lg.translate(dx+D.face*U()*0.3*k,dy+U()*0.08*k);lg.scale(D.face,1);const L=W*(far?0.42:0.55)*k,cg=lg.createRadialGradient(0,0,0,0,0,L);cg.addColorStop(0,'rgba(0,0,0,1)');cg.addColorStop(0.6,'rgba(0,0,0,.7)');cg.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=cg;lg.beginPath();lg.moveTo(0,0);lg.arc(0,0,L,-0.42,0.42);lg.closePath();lg.fill();lg.restore();}
  g.imageSmoothingEnabled=true;g.drawImage(lightC,0,0,lw,lh,0,0,W,H);
  if(lampOn){g.save();g.globalCompositeOperation='lighter';g.translate(D.x-cam.x+D.face*U()*0.3,D.y-cam.y+U()*0.08);g.scale(D.face,1);const L=W*(far?0.4:0.5),wg=g.createRadialGradient(0,0,0,0,0,L);wg.addColorStop(0,'rgba(255,200,140,0.16)');wg.addColorStop(1,'rgba(255,200,140,0)');g.fillStyle=wg;g.beginPath();g.moveTo(0,0);g.arc(0,0,L,-0.4,0.4);g.closePath();g.fill();g.restore();}
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');g.fillStyle=vg;g.fillRect(0,0,W,H);
}
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);
  if(pixel){drawScene(ctx);lowc.imageSmoothingEnabled=true;lowc.drawImage(cv,0,0,low.width,low.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,W,H);}
  else drawScene(ctx);
  requestAnimationFrame(frame);}
init();requestAnimationFrame(frame);
</script>
